# Offline denseness suite + structure checks.
#
# structure  — always runs on ubuntu-latest (no Aura binary).
# denseness  — builds Aura in org CI image (CMake 4.3+) then runs report.sh.
name: denseness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure checks
        run: bash ./scripts/check-structure.sh

  denseness:
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 120
    # Same toolchain image as Aura nightly (CMake 4.3+, Ninja, clang).
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout aether
        uses: actions/checkout@v4
        with:
          path: aether

      - name: Checkout aura
        uses: actions/checkout@v4
        with:
          repository: cybrid-systems/aura
          path: aura
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aura Python CI deps
        working-directory: aura
        run: |
          set -euo pipefail
          if [[ -f requirements-dev.txt ]]; then
            pip install --break-system-packages -r requirements-dev.txt \
              || pip install -r requirements-dev.txt
          fi

      - name: Build Aura binary (target aura only)
        working-directory: aura
        env:
          # Match Aura CI job sizing; image ships Ninja + CMake 4.3+.
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          # build.py build also compiles test_ir/test_concurrent; denseness only
          # needs the aura CLI binary + shared modules next to it.
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(".").resolve()
          build = root / "build"
          build.mkdir(parents=True, exist_ok=True)
          nproc = os.environ.get("CMAKE_BUILD_PARALLEL_LEVEL", str(os.cpu_count() or 4))
          conf = [
              "cmake", "-B", str(build), "-G", "Ninja", "-Wno-dev",
              "-DCMAKE_BUILD_TYPE=Release",
              "-DCMAKE_EXPERIMENTAL_CXX_IMPORT_STD=f35a9ac6-8463-4d38-8eec-5d6008153e7d",
          ]
          print("+", " ".join(conf), flush=True)
          r = subprocess.call(conf, cwd=root)
          if r != 0:
              sys.exit(r)
          cmd = ["cmake", "--build", str(build), "--target", "aura", "-j", nproc]
          print("+", " ".join(cmd), flush=True)
          r = subprocess.call(cmd, cwd=root)
          if r != 0:
              print("retry aura target once", flush=True)
              r = subprocess.call(cmd, cwd=root)
          sys.exit(r)
          PY
          test -x build/aura
          ls -la build/aura build/*.so 2>/dev/null || true

      - name: Run denseness report
        working-directory: aether
        env:
          AURA_BIN: ${{ github.workspace }}/aura/build/aura
          AURA_LIB: ${{ github.workspace }}/aura/lib
          # Ensure rpath/shared libs resolve on the runner.
          LD_LIBRARY_PATH: ${{ github.workspace }}/aura/build
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -x "$AURA_BIN"
          test -d "$AURA_LIB/std"
          ./scripts/report.sh
          test -f notes/last-run-report.md
          grep -q 'ALL PASSED' notes/last-run-report.md
          tail -n 20 notes/last-run-report.md

      - name: Upload last-run-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: aether/notes/last-run-report.md
          if-no-files-found: ignore
