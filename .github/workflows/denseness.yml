# Offline denseness suite + structure checks.
#
# structure  — always runs on ubuntu-latest (no Aura binary).
# denseness  — builds Aura in org CI image (CMake 4.3+) then runs report.sh.
name: denseness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure checks
        run: bash ./scripts/check-structure.sh

  denseness:
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 120
    # Same toolchain image as Aura nightly (CMake 4.3+, Ninja, clang).
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout aether
        uses: actions/checkout@v4
        with:
          path: aether

      - name: Checkout aura
        uses: actions/checkout@v4
        with:
          repository: cybrid-systems/aura
          path: aura
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aura Python CI deps
        working-directory: aura
        run: |
          set -euo pipefail
          if [[ -f requirements-dev.txt ]]; then
            pip install --break-system-packages -r requirements-dev.txt \
              || pip install -r requirements-dev.txt
          fi

      - name: Build Aura binary
        working-directory: aura
        run: |
          set -euo pipefail
          python3 build.py build
          test -x build/aura
          # Shared modules (e.g. libaura-reflect.so) live next to the binary.
          ls -la build/aura build/*.so 2>/dev/null || true

      - name: Run denseness report
        working-directory: aether
        env:
          AURA_BIN: ${{ github.workspace }}/aura/build/aura
          AURA_LIB: ${{ github.workspace }}/aura/lib
          # Ensure rpath/shared libs resolve on the runner.
          LD_LIBRARY_PATH: ${{ github.workspace }}/aura/build
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          test -x "$AURA_BIN"
          test -d "$AURA_LIB/std"
          ./scripts/report.sh
          test -f notes/last-run-report.md
          grep -q 'ALL PASSED' notes/last-run-report.md
          tail -n 20 notes/last-run-report.md

      - name: Upload last-run-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: aether/notes/last-run-report.md
          if-no-files-found: ignore
