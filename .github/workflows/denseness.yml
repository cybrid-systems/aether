# Offline denseness suite + structure checks.
#
# Structure job always runs (no Aura binary).
# Denseness job runs when Aura is available via:
#   - repo variable/secrets, or
#   - sibling checkout of cybrid-systems/aura (same org; needs permissions), or
#   - self-hosted runner with AURA_BIN preinstalled.
name: denseness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure checks
        run: bash ./scripts/check-structure.sh

  denseness:
    runs-on: ubuntu-latest
    needs: structure
    # Skip gracefully when Aura cannot be obtained (fork PRs without access).
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: aether

      - name: Checkout Aura (stdlib + sources)
        id: aura
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: cybrid-systems/aura
          path: aura
          # Same-org token works for private aura when GITHUB_TOKEN has access;
          # forks may fail — denseness then reports skip via next step.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate or build Aura binary
        id: bin
        working-directory: aether
        run: |
          set -euo pipefail
          if [[ -x "${{ github.workspace }}/aura/build/aura" ]]; then
            echo "AURA_BIN=${{ github.workspace }}/aura/build/aura" >> "$GITHUB_ENV"
            echo "AURA_LIB=${{ github.workspace }}/aura/lib" >> "$GITHUB_ENV"
            echo "found=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -d "${{ github.workspace }}/aura" && -f "${{ github.workspace }}/aura/CMakeLists.txt" ]]; then
            echo "Building Aura (Release)…"
            cmake -S "${{ github.workspace }}/aura" -B "${{ github.workspace }}/aura/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "${{ github.workspace }}/aura/build" -j"$(nproc)" --target aura || \
              cmake --build "${{ github.workspace }}/aura/build" -j"$(nproc)"
            if [[ -x "${{ github.workspace }}/aura/build/aura" ]]; then
              echo "AURA_BIN=${{ github.workspace }}/aura/build/aura" >> "$GITHUB_ENV"
              echo "AURA_LIB=${{ github.workspace }}/aura/lib" >> "$GITHUB_ENV"
              echo "found=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "found=0" >> "$GITHUB_OUTPUT"
          echo "::warning::Aura binary not available; denseness suite skipped (structure already passed)."

      - name: Run denseness report
        if: steps.bin.outputs.found == '1'
        working-directory: aether
        env:
          AURA_BIN: ${{ env.AURA_BIN }}
          AURA_LIB: ${{ env.AURA_LIB }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/report.sh
          test -f notes/last-run-report.md
          grep -q 'ALL PASSED' notes/last-run-report.md

      - name: Upload last-run-report
        if: steps.bin.outputs.found == '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: aether/notes/last-run-report.md
          if-no-files-found: ignore
